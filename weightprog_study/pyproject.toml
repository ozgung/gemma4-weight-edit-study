[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "weightprog-study"
version = "0.1.0"
description = "Experiment kit of the Gemma 4 E4B escape-artefact weight-editing study: edit_file call replay and scoring, the pre-registered gate, the forward-pass budget server, sandbox and audit. Built on weightprog."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Ozgun Genc" }]
dependencies = ["weightprog>=0.2", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
weightprog-study = "weightprog_study.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
weightprog_study = ["gate/*.md", "proposer/*.md", "proposer/sandbox/*.sh", "proposer/sandbox/*.sb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "mlx: needs the mlx extra",
    "torch: needs the torch extra",
    "regression: reads experiment outputs given by an environment variable",
]
